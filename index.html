<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heanvoo's Repo</title>
  
  <!-- Подключаем скругленный шрифт -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      
      background-color: #2b303b; 
      color: #d8dee9; 
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; /* Центрируем всё по вертикали и горизонтали */
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 25px;
      color: #eceff4; /* Чуть более белый цвет для заголовка */
      letter-spacing: 0.5px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 8px; /* Расстояние между строками */
      margin-bottom: 40px;
    }

    .links a {
      color: #d8dee9;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.2s;
    }

    .links a:hover {
      color: #88c0d0; 
    }

    
    .links a span {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .footer {
      font-size: 14px;
      color: #8a95a5;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Heanvoo's Repo</h1>

  <div class="links">
    <a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://heanvoo.github.io/repo">Add to <span>Cydia</span></a>
    <a href="sileo://source/https://heanvoo.github.io/repo">Add to <span>Sileo</span></a>
    <a href="zbra://sources/add/https://heanvoo.github.io/repo">Add to <span>Zebra</span></a>
  </div>

  <div class="footer">
    Hello world!
  </div>

</body>
</html>
