name: Build tweak and publish Sileo repo

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build StretchClock .deb
        run: make package FINALPACKAGE=1

      - name: Build VibeSnow .deb
        run: make -C VibeSnow package FINALPACKAGE=1

      - name: Add third-party debs
        run: |
          mkdir -p site/debs
          cp debs/*.deb site/debs/ 2>/dev/null || true

      - name: Fetch vibefetch.deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/debs
          TAG=$(gh release list --limit 50 --json tagName \
            --jq '[.[] | select(.tagName | startswith("vibefetch-"))][0].tagName')
          [ -n "$TAG" ] && gh release download "$TAG" --pattern '*.deb' --dir site/debs || echo "no vibefetch release yet"

      - name: Create Sileo repository
        run: |
          mkdir -p site/debs
          cp packages/*.deb site/debs/
          cp VibeSnow/packages/*.deb site/debs/
          cp CydiaIcon.png site/CydiaIcon.png
          cp RepoIcon.png site/RepoIcon.png
          cp index.html site/index.html
          cd site
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -k -f Packages
          gzip -k -f Packages
          cat > Release <<'REL'
          Origin: Heanvoo's Repository
          Label: Heanvoo's Repository
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64
          Components: main
          Description: Heanvoo's tweaks repository
          REL

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
