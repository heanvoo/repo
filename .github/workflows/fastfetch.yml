name: fastfetch

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "fastfetch tag (empty = latest)"
        required: false
  schedule:
    - cron: "0 3 * * 1"   # раз в неделю проверяет новый релиз

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newer Xcode (C23 support)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          clang --version

      - name: Resolve fastfetch version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG=$(gh api repos/fastfetch-cli/fastfetch/releases/latest --jq .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: have
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "fastfetch-${{ steps.v.outputs.ver }}" >/dev/null 2>&1 \
             && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Tools
        if: steps.have.outputs.skip != '1'
        run: brew install cmake ldid dpkg

      - name: Fetch source
        if: steps.have.outputs.skip != '1'
        run: git clone --depth 1 --branch "${{ steps.v.outputs.tag }}" https://github.com/fastfetch-cli/fastfetch.git ff

      - name: Cross-compile for iOS arm64 (rootless)
        if: steps.have.outputs.skip != '1'
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cmake -S ff -B build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/var/jb/usr \
            -DBUILD_FLASHFETCH=OFF \
            -DBUILD_TESTS=OFF \
            -DENABLE_VULKAN=OFF -DENABLE_WAYLAND=OFF -DENABLE_XCB=OFF -DENABLE_XRANDR=OFF \
            -DENABLE_DRM=OFF -DENABLE_GIO=OFF -DENABLE_DCONF=OFF -DENABLE_DBUS=OFF \
            -DENABLE_IMAGEMAGICK6=OFF -DENABLE_IMAGEMAGICK7=OFF -DENABLE_CHAFA=OFF \
            -DENABLE_ZLIB=OFF -DENABLE_EGL=OFF -DENABLE_GLX=OFF -DENABLE_OPENCL=OFF \
            -DENABLE_PULSE=OFF -DENABLE_RPM=OFF -DENABLE_SQLITE3=OFF
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          DESTDIR="$PWD/pkg" cmake --install build

      - name: Sign + package .deb
        if: steps.have.outputs.skip != '1'
        run: |
          set -e
          ROOT=pkg
          # перенос под rootless-префикс
          if [ ! -d "$ROOT/var/jb" ]; then
            mkdir -p "$ROOT/var/jb"; mv "$ROOT/usr" "$ROOT/var/jb/usr" 2>/dev/null || true
          fi
          find "$ROOT" -type f -perm -u+x -exec file {} \; | grep -q Mach-O && \
            find "$ROOT" -type f -perm -u+x -exec sh -c 'file "$1" | grep -q Mach-O && ldid -S "$1"' _ {} \;
          mkdir -p "$ROOT/DEBIAN"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: com.heanvoo.fastfetch
          Name: fastfetch
          Version: ${{ steps.v.outputs.ver }}
          Architecture: iphoneos-arm64
          Description: Fast neofetch-like system info tool, built for NewTerm 3 Beta (rootless)
          Maintainer: Heanvoo
          Author: fastfetch-cli
          Section: Terminal_Support
          Icon: https://heanvoo.github.io/repo/RepoIcon.png
          EOF
          sed -i '' 's/^ *//' "$ROOT/DEBIAN/control"
          mkdir -p out
          dpkg-deb -Zgzip -b "$ROOT" "out/com.heanvoo.fastfetch_${{ steps.v.outputs.ver }}_iphoneos-arm64.deb"
          ls -la out

      - name: Attach to release
        if: steps.have.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "fastfetch-${{ steps.v.outputs.ver }}" -y --cleanup-tag 2>/dev/null || true
          gh release create "fastfetch-${{ steps.v.outputs.ver }}" out/*.deb \
            --title "fastfetch ${{ steps.v.outputs.ver }}" --notes "Rootless build for NewTerm 3 Beta"

      - name: Republish Sileo repo
        if: steps.have.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "${{ github.event.repository.default_branch }}"

      - uses: actions/upload-artifact@v4
        if: steps.have.outputs.skip != '1'
        with:
          name: fastfetch-deb
          path: out/*.deb
